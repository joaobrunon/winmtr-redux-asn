name: Windows Build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CMake
        uses: lukka/get-cmake@v3

      - name: Build (Release x64) and package
        shell: pwsh
        run: .\build.ps1 -Config Release -Arch x64 -Package

      - name: Build (Debug x64) and package
        shell: pwsh
        run: .\build.ps1 -Config Debug -Arch x64 -Package

      - name: Upload artifact (Release)
        uses: actions/upload-artifact@v4
        with:
          name: winmtr-x64-release
          path: dist/*Release*.zip

      - name: Upload artifact (Debug)
        uses: actions/upload-artifact@v4
        with:
          name: winmtr-x64-debug
          path: dist/*Debug*.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-${{ github.run_number }}
          name: CI build ${{ github.run_number }}
          files: dist/*.zip
